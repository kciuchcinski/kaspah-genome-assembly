# Read QC, single-platform assembly, mapping, statistics and the ANI pairing test.
# Covers scripts 07, 08, 21, 22 and the short-read half of 17.
#
#   pixi install --manifest-path envs/assembly
#   pixi run   --manifest-path envs/assembly bash scripts/21_ont_read_stats.sh
#
# samtools, racon and bwa are left unpinned on purpose: the versions this project ran
# (1.15.1, 1.4.20, 0.7.17) predate the conda-forge zlib 1.3 transition and cannot be
# solved alongside minimap2 2.30 or seqkit 2.11. They are used for sorting, indexing and
# alignment only, and the newer builds are drop-in.
[workspace]
name = "kaspah-assembly"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
flye = "==2.9.6"
filtlong = "==0.3.1"
fastp = "==0.23.4"
unicycler = "==0.5.0"
spades = "==4.2.0"
minimap2 = "==2.30"
seqkit = "==2.11.0"
polypolish = "==0.5.0"
sourmash = "==4.9.4"
samtools = "*"
racon = "*"
bwa = "*"
