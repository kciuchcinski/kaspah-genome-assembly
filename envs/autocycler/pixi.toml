# Multi-assembler consensus. Covers script 13.
#
#   pixi install --manifest-path envs/autocycler
#
# Separate because miniasm 0.3 and minipolish 0.2.0 are pre-zlib-1.3 builds that cannot
# be solved alongside minimap2 2.30 or seqkit 2.11 in assembly.toml.
[workspace]
name = "kaspah-autocycler"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
autocycler = "==0.5.2"
raven-assembler = "==1.8.3"
miniasm = "==0.3"
minipolish = "==0.2.0"
necat = "*"
flye = "==2.9.6"
